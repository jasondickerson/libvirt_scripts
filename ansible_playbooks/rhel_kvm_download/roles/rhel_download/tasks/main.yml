---
- name: Login to Red Hat APIs
  ansible.builtin.uri:
    url: "{{ rhel_download_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: refresh_token
      client_id: rhsm-api
      refresh_token: "{{ rhel_download_offline_token }}"
  register: __rhel_download_login

- name: Collecting the available images
  ansible.builtin.uri:
    url: "{{ rhel_download_images_url }}"
    method: GET
    return_content: true
    headers:
      Authorization: Bearer {{ __rhel_download_login.json.access_token }}
  register: __rhel_download_output

- name: Select the specified image to download
  ansible.builtin.set_fact:
    __rhel_download_images: >
      {{ __rhel_download_output.json.body
      | selectattr('filename', 'match', 'rhel-' + ((rhel_download_type + '-') if rhel_download_type == 'rt' else '') + rhel_download_image_version | string)
      | selectattr('filename', 'search', rhel_download_type) }}

- name: Display all filenames available for download
  ansible.builtin.debug:
    msg: "{{ __rhel_download_images | map(attribute='filename') | list }}"

- name: Assert if an image is selected if its available for download
  ansible.builtin.assert:
    that:
      - __rhel_download_images | length != 0
    fail_msg:
      - "The selected version {{ rhel_download_image_version }} is not available for download. Please check the version and try again."

- name: Downloading image RHEL {{ rhel_download_image_version + ' ' + rhel_download_type }}
  ansible.builtin.get_url:
    url: "{{ __rhel_download_images[0].downloadHref }}"
    dest: "{{ rhel_download_dest_dir }}/{{ __rhel_download_images[0].filename }}"
    mode: "0644"
    headers:
      Authorization: Bearer {{ __rhel_download_login.json.access_token }}
  register: __rhel_download_downloads
...

